<svg width="900" height="156" viewBox="0 0 900 156" xmlns="http://www.w3.org/2000/svg" role="img">
<defs>
<pattern id="dotsp" width="15" height="15" patternUnits="userSpaceOnUse">
<circle cx="1.4" cy="1.4" r="1.1" fill="#efefef"/>
</pattern>
<linearGradient id="sweepp" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#d21f2c" stop-opacity="0"/>
<stop offset="50%" stop-color="#d21f2c" stop-opacity="0.10"/>
<stop offset="100%" stop-color="#d21f2c" stop-opacity="0"/>
</linearGradient>
</defs>
<style>
text { font-family: 'JetBrains Mono','SFMono-Regular','Cascadia Code',Consolas,monospace; }
.sans { font-family: 'Space Grotesk','Segoe UI',Inter,sans-serif; }
.ink { fill:#0a0a0a; }
.muted { fill:#4d4d4d; }
.dim { fill:#8a8a8a; }
.accent { fill:#d21f2c; }
.accent2 { fill:#8a1015; }
.line { stroke:#e6e6e6; }
@keyframes blinkp { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }
.cursorp { animation: blinkp 1.1s steps(1,end) infinite; }
</style>
<clipPath id="clipp"><rect x="4" y="4" width="892" height="148" rx="18"/></clipPath>
<rect x="4" y="4" width="892" height="148" rx="18" fill="#ffffff" stroke="#e6e6e6" stroke-width="1.2"/>
<rect x="4" y="4" width="892" height="148" rx="18" fill="url(#dotsp)" opacity="0.6"/>
<g clip-path="url(#clipp)"><rect x="-490.6" y="4" width="490.6" height="148" fill="url(#sweepp)"><animate attributeName="x" from="-490.6" to="900" dur="8s" begin="-1s" repeatCount="indefinite"/></rect></g>
<path d="M 13 26 L 13 13 L 26 13" fill="none" stroke="#d21f2c" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
<path d="M 887 26 L 887 13 L 874 13" fill="none" stroke="#d21f2c" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
<path d="M 13 130 L 13 143 L 26 143" fill="none" stroke="#d21f2c" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
<path d="M 887 130 L 887 143 L 874 143" fill="none" stroke="#d21f2c" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
<text x="40" y="66" font-size="46" class="accent sans" font-weight="700" opacity="0.5">“</text>
<text x="78" y="66" font-size="19" class="ink sans" font-weight="700">Ship the full stack, not just the feature.</text>
<text x="78" y="94" font-size="12.5" class="muted">Prototype fast, refactor with intent — and treat every layer,</text>
