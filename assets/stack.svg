<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270">
<style>
  :root { color-scheme: light dark; }
  .light { display: block; }
  .dark { display: none; }
  @media (prefers-color-scheme: dark) {
    .light { display: none; }
    .dark { display: block; }
  }
  text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
</style>
<g class="light">
<rect width="1200" height="270" fill="#ffffff"/>
<g font-family="Inter, sans-serif">
<text x="30" y="40" font-size="13" font-weight="700" letter-spacing="2" fill="#57606a">LANGUAGES</text>
<text x="30" y="76" font-size="18" font-weight="700" fill="#0d1117">Python</text><text x="160" y="76" font-size="18" font-weight="700" fill="#0d1117">Dart</text><text x="270" y="76" font-size="18" font-weight="700" fill="#0d1117">Kotlin</text><text x="405" y="76" font-size="18" font-weight="700" fill="#0d1117">JavaScript</text>
<text x="30" y="130" font-size="13" font-weight="700" letter-spacing="2" fill="#57606a">FRAMEWORKS &amp; DEVELOPMENT</text>
<text x="30" y="166" font-size="18" font-weight="700" fill="#0d1117">Flutter</text><text x="150" y="166" font-size="18" font-weight="700" fill="#0d1117">Android</text><text x="290" y="166" font-size="18" font-weight="700" fill="#0d1117">MongoDB</text>
<text x="30" y="220" font-size="13" font-weight="700" letter-spacing="2" fill="#57606a">TOOLS</text>
<text x="30" y="250" font-size="16" fill="#0d1117">Git · GitHub · VS Code · Android Studio · Figma</text>
</g>
</g>
<g class="dark">
<rect width="1200" height="270" fill="#ffffff"/>
<g font-family="Inter, sans-serif">
<text x="30" y="40" font-size="13" font-weight="700" letter-spacing="2" fill="#8b949e">LANGUAGES</text>
<text x="30" y="76" font-size="18" font-weight="700" fill="#ffffff">Python</text><text x="160" y="76" font-size="18" font-weight="700" fill="#ffffff">Dart</text><text x="270" y="76" font-size="18" font-weight="700" fill="#ffffff">Kotlin</text><text x="405" y="76" font-size="18" font-weight="700" fill="#ffffff">JavaScript</text>
<text x="30" y="130" font-size="13" font-weight="700" letter-spacing="2" fill="#8b949e">FRAMEWORKS &amp; DEVELOPMENT</text>
<text x="30" y="166" font-size="18" font-weight="700" fill="#ffffff">Flutter</text><text x="150" y="166" font-size="18" font-weight="700" fill="#ffffff">Android</text><text x="290" y="166" font-size="18" font-weight="700" fill="#ffffff">MongoDB</text>
<text x="30" y="220" font-size="13" font-weight="700" letter-spacing="2" fill="#8b949e">TOOLS</text>
<text x="30" y="250" font-size="16" fill="#ffffff">Git · GitHub · VS Code · Android Studio · Figma</text>
</g>
