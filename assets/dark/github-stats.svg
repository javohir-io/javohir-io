<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210">
<style>
  :root { color-scheme: light dark; }
  .light { display: block; }
  .dark { display: none; }
  @media (prefers-color-scheme: dark) {
    .light { display: none; }
    .dark { display: block; }
  }
  text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
</style>
<g class="light">
<rect width="1200" height="210" fill="#ffffff"/>
<rect x="20" y="20" width="1160" height="170" rx="10" fill="none" stroke="#d0d7de"/>
<text x="55" y="62" font-size="13" font-weight="700" letter-spacing="2" fill="#57606a">GITHUB TELEMETRY</text>
<text x="55" y="108" font-size="24" font-weight="700" fill="#0d1117">Code is a process, not a finished state.</text>
<text x="55" y="142" font-size="14" fill="#57606a">Projects · commits · experiments · continuous improvement</text>
<circle cx="1080" cy="105" r="34" fill="none" stroke="#0d1117" stroke-width="2"><animate attributeName="r" values="28;38;28" dur="3s" repeatCount="indefinite"/></circle>
<circle cx="1080" cy="105" r="5" fill="#1f6feb"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
</g>
<g class="light">
<rect width="1200" height="210" fill="#0d1117"/>
<rect x="20" y="20" width="1160" height="170" rx="10" fill="none" stroke="#30363d"/>
<text x="55" y="62" font-size="13" font-weight="700" letter-spacing="2" fill="#8b949e">GITHUB TELEMETRY</text>
<text x="55" y="108" font-size="24" font-weight="700" fill="#e6edf3">Code is a process, not a finished state.</text>
<text x="55" y="142" font-size="14" fill="#8b949e">Projects · commits · experiments · continuous improvement</text>
<circle cx="1080" cy="105" r="34" fill="none" stroke="#e6edf3" stroke-width="2"><animate attributeName="r" values="28;38;28" dur="3s" repeatCount="indefinite"/></circle>
<circle cx="1080" cy="105" r="5" fill="#58a6ff"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
</g>
</svg>