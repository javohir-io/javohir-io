<svg width="1000" height="28" viewBox="0 0 1000 28" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true"><title></title>
<defs>


</defs>
<style>
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes comet{from{stroke-dashoffset:0}to{stroke-dashoffset:-100}}
@keyframes blink{0%,48%{opacity:1}52%,100%{opacity:0}}
@keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(4.2);opacity:0}}
.cm{stroke-dasharray:11 89;animation:comet 6s linear infinite}
.blink{animation:blink 1.1s steps(1) infinite}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.8s ease-out infinite}
@keyframes mote{0%{opacity:0;transform:translateY(0)}20%{opacity:.9}80%{opacity:.9}100%{opacity:0;transform:translateY(-70px)}}
@keyframes seq{0%,100%{opacity:.2}20%{opacity:1}45%{opacity:.2}}
</style>
<clipPath id="dlc"><rect x="72" y="11" width="394.0" height="6"/></clipPath>
<linearGradient id="dlg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c29a47" stop-opacity="0"/><stop offset=".5" stop-color="#c29a47" stop-opacity="1.0"/><stop offset="1" stop-color="#c29a47" stop-opacity="0"/></linearGradient>
<line x1="72" y1="14" x2="466.0" y2="14" stroke="#d8d1be"/>
<g clip-path="url(#dlc)"><rect x="-48" y="13.25" width="120" height="1.5" fill="url(#dlg)">
<animate attributeName="x" values="-48;466.0;466.0" keyTimes="0;.55;1" dur="7s" begin="0s" repeatCount="indefinite"/></rect></g><clipPath id="drc"><rect x="534.0" y="11" width="394.0" height="6"/></clipPath>
<linearGradient id="drg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c29a47" stop-opacity="0"/><stop offset=".5" stop-color="#c29a47" stop-opacity="1.0"/><stop offset="1" stop-color="#c29a47" stop-opacity="0"/></linearGradient>
<line x1="534.0" y1="14" x2="928" y2="14" stroke="#d8d1be"/>
<g clip-path="url(#drc)"><rect x="414.0" y="13.25" width="120" height="1.5" fill="url(#drg)">
<animate attributeName="x" values="414.0;928;928" keyTimes="0;.55;1" dur="7s" begin="-3.5s" repeatCount="indefinite"/></rect></g><rect x="483.0" y="11" width="6" height="6" fill="#8f6d2b" opacity=".25" style="animation:seq 1.8s linear 0.0s infinite"/><rect x="495.0" y="11" width="6" height="6" fill="#8f6d2b" opacity=".25" style="animation:seq 1.8s linear 0.3s infinite"/><rect x="507.0" y="11" width="6" height="6" fill="#8f6d2b" opacity=".25" style="animation:seq 1.8s linear 0.6s infinite"/>
