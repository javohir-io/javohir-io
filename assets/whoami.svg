<text x="48" y="40" font-size="13" class="muted" letter-spacing="0.5">01.whoami</text>
<text x="32" y="72" font-size="14.5" class="ink">Software engineer who builds products end-to-end — from the Flutter</text>
<text x="32" y="94" font-size="14.5" class="ink">screen a user taps, through the API that authenticates them, down to</text>
<text x="32" y="116" font-size="14.5" class="ink">the PostgreSQL schema underneath. Currently studying Machine Learning,</text>
<text x="32" y="138" font-size="14.5" class="ink">Deep Learning &amp; Data Mining at university alongside shipping full-stack</text>
<text x="32" y="160" font-size="14.5" class="ink">apps and the occasional game.</text>
