  <text x="34" y="90" text-anchor="start" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-weight="500" font-size="16.5" fill="#e6edf3">Full-stack &amp; mobile engineer who ships the whole pipeline —</text><text x="34" y="116" text-anchor="start" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-weight="500" font-size="16.5" fill="#e6edf3">Flutter on the client, a Node.js/Express REST API in the middle,</text><text x="34" y="142" text-anchor="start" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-weight="500" font-size="16.5" fill="#e6edf3">PostgreSQL underneath, and a lightweight admin panel wired to it all.</text>
