<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="90" viewBox="0 0 1200 90">
<style>
  :root { color-scheme: light dark; }
  .light { display: block; }
  .dark { display: none; }
  @media (prefers-color-scheme: dark) {
    .light { display: none; }
    .dark { display: block; }
  }
  text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
</style>
<g class="light">
<rect width="1200" height="90" fill="#0d1117"/>
<line x1="20" y1="88" x2="1180" y2="88" stroke="#30363d" stroke-width="1"/>
<text x="24" y="42" font-size="14" font-weight="700" letter-spacing="3" fill="#8b949e">04</text>
<text x="82" y="44" font-size="24" font-weight="700" fill="#e6edf3">STACK</text>
<text x="1180" y="43" text-anchor="end" font-size="12" letter-spacing="2" fill="#8b949e">TOOLS</text>
</g>
<g class="dark">
<rect width="1200" height="90" fill="#0d1117"/>
<line x1="20" y1="88" x2="1180" y2="88" stroke="#30363d" stroke-width="1"/>
<text x="24" y="42" font-size="14" font-weight="700" letter-spacing="3" fill="#8b949e">04</text>
<text x="82" y="44" font-size="24" font-weight="700" fill="#0d1117">STACK</text>
<text x="1180" y="43" text-anchor="end" font-size="12" letter-spacing="2" fill="#8b949e">TOOLS</text>
</g>
</svg>