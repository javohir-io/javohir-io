name: Update Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets/dark

          python3 <<'PY'
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timedelta

          username = "javohir-io"

          query = """
          query($login:String!) {
            user(login:$login) {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      contributionCount
                      date
                    }
                  }
                }
              }
            }
          }
          """

          import json
          import os

          data = json.dumps({
              "query": query,
              "variables": {"login": username}
          }).encode()

          req = urllib.request.Request(
              "https://api.github.com/graphql",
              data=data,
              headers={
                  "Authorization": "bearer " + os.environ["GH_TOKEN"],
                  "Content-Type": "application/json",
                  "User-Agent": "github-contribution-generator"
              }
          )

          with urllib.request.urlopen(req) as response:
              result = json.load(response)

          calendar = result["data"]["user"]["contributionsCollection"]["contributionCalendar"]
          weeks = calendar["weeks"]

          # Graph dimensions
          width = 1200
          height = 230

          left = 30
          top = 55

          cell = 12
          gap = 4

          colors_light = [
              "#ebedf0",
              "#9be9a8",
              "#40c463",
              "#30a14e",
              "#216e39"
          ]

          colors_dark = [
              "#161b22",
              "#0e4429",
              "#006d32",
              "#26a641",
              "#39d353"
          ]

          def level(count):
              if count == 0:
                  return 0
              if count <= 2:
                  return 1
              if count <= 5:
                  return 2
              if count <= 10:
                  return 3
              return 4

          def build_svg(colors, background, foreground, muted, filename):
              parts = []

              parts.append(
                  f'<svg xmlns="http://www.w3.org/2000/svg" '
                  f'width="{width}" height="{height}" '
                  f'viewBox="0 0 {width} {height}">'
              )

              parts.append(
                  f'<rect width="100%" height="100%" fill="{background}"/>'
              )

              parts.append(
                  f'<text x="{left}" y="25" '
                  f'font-family="Inter,Arial,sans-serif" '
                  f'font-size="13" font-weight="700" '
                  f'letter-spacing="2" fill="{muted}">'
                  f'CONTRIBUTION TELEMETRY</text>'
              )

              parts.append(
                  f'<text x="{width-left}" y="25" '
                  f'text-anchor="end" '
                  f'font-family="Inter,Arial,sans-serif" '
                  f'font-size="12" fill="{muted}">'
                  f'{calendar["totalContributions"]} contributions</text>'
              )

              for week_index, week in enumerate(weeks):
                  for day_index, day in enumerate(week["contributionDays"]):

                      count = day["contributionCount"]
                      color = colors[level(count)]

                      x = left + week_index * (cell + gap)
                      y = top + day_index * (cell + gap)

                      parts.append(
                          f'<rect x="{x}" y="{y}" '
                          f'width="{cell}" height="{cell}" rx="2" '
                          f'fill="{color}">'
                          f'<title>{day["date"]}: {count} contributions</title>'
                          f'</rect>'
                      )

              legend_y = top + 7 * (cell + gap) + 22

              parts.append(
                  f'<text x="{left}" y="{legend_y}" '
                  f'font-family="Inter,Arial,sans-serif" '
                  f'font-size="11" fill="{muted}">Less</text>'
              )

              for i, color in enumerate(colors):
                  x = left + 35 + i * 18

                  parts.append(
                      f'<rect x="{x}" y="{legend_y-10}" '
                      f'width="12" height="12" rx="2" fill="{color}"/>'
                  )

              parts.append(
                  f'<text x="{left+135}" y="{legend_y}" '
                  f'font-family="Inter,Arial,sans-serif" '
                  f'font-size="11" fill="{muted}">More</text>'
              )

              parts.append("</svg>")

              with open(filename, "w", encoding="utf-8") as f:
                  f.write("".join(parts))

          build_svg(
              colors_light,
              "#ffffff",
              "#0d1117",
              "#57606a",
              "assets/contributions.svg"
          )

          build_svg(
              colors_dark,
              "#0d1117",
              "#ffffff",
              "#8b949e",
              "assets/dark/contributions.svg"
          )

          print("Contribution graph generated successfully.")
          PY

      - name: Commit contribution graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/contributions.svg assets/dark/contributions.svg

          git diff --cached --quiet || git commit -m "chore: update contribution graph"

          git push
