<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220">
<style>
  :root { color-scheme: light dark; }
  .light { display: block; }
  .dark { display: none; }
  @media (prefers-color-scheme: dark) {
    .light { display: none; }
    .dark { display: block; }
  }
  text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
</style>
<g class="light">
<rect width="1200" height="220" fill="#0d1117"/>
<g opacity=".9">
<path d="M0 170 C180 80 330 250 510 145 S850 70 1200 155" fill="none" stroke="#e6edf3" stroke-width="2"/>
<path d="M0 188 C180 98 330 268 510 163 S850 88 1200 173" fill="none" stroke="#30363d" stroke-width="1"/>
<circle cx="150" cy="125" r="4" fill="#e6edf3"><animate attributeName="cy" values="125;105;125" dur="3s" repeatCount="indefinite"/></circle>
<circle cx="850" cy="105" r="3" fill="#58a6ff"><animate attributeName="cy" values="105;125;105" dur="4s" repeatCount="indefinite"/></circle>
</g>
<text x="600" y="82" text-anchor="middle" font-size="18" letter-spacing="6" fill="#8b949e">SOFTWARE DEVELOPER</text>
<text x="600" y="125" text-anchor="middle" font-size="48" font-weight="700" fill="#e6edf3">JAVOHIR ABDUVAHHOBOV</text>
<text x="600" y="160" text-anchor="middle" font-size="18" letter-spacing="4" fill="#8b949e">LET'S CREATE.</text>
</g>
<g class="dark">
<rect width="1200" height="220" fill="#0d1117"/>
<g opacity=".9">
<path d="M0 170 C180 80 330 250 510 145 S850 70 1200 155" fill="none" stroke="#0d1117" stroke-width="2"/>
<path d="M0 188 C180 98 330 268 510 163 S850 88 1200 173" fill="none" stroke="#30363d" stroke-width="1"/>
<circle cx="150" cy="125" r="4" fill="#0d1117"><animate attributeName="cy" values="125;105;125" dur="3s" repeatCount="indefinite"/></circle>
<circle cx="850" cy="105" r="3" fill="#58a6ff"><animate attributeName="cy" values="105;125;105" dur="4s" repeatCount="indefinite"/></circle>
</g>
<text x="600" y="82" text-anchor="middle" font-size="18" letter-spacing="6" fill="#8b949e">SOFTWARE DEVELOPER</text>
<text x="600" y="125" text-anchor="middle" font-size="48" font-weight="700" fill="#0d1117">JAVOHIR ABDUVAHHOBOV</text>
<text x="600" y="160" text-anchor="middle" font-size="18" letter-spacing="4" fill="#8b949e">LET'S CREATE.</text>
</g>
