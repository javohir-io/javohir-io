-size="14">Tashkent, UZ</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1" dur="0.6s" begin="0.25s" fill="freeze"/><text x="40" y="148" class="muted" font-size="14">role:</text><text x="185" y="148" class="ink" font-size="14">full-stack &amp; mobile engineer</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1" dur="0.6s" begin="0.50s" fill="freeze"/><text x="40" y="178" class="muted" font-size="14">stack:</text><text x="185" y="178" class="ink" font-size="14">flutter . node.js . react . postgresql</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1" dur="0.6s" begin="0.75s" fill="freeze"/><text x="40" y="208" class="muted" font-size="14">also studying:</text><text x="185" y="208" class="ink" font-size="14">machine learning . deep learning . data mining</text></g><text x="40" y="252" class="dim" font-size="12.5" opacity="0">one codebase, one brain: from the screen a user taps, through the<animate attributeName="opacity" values="0;0;1" dur="0.5s" begin="1.10s" fill="freeze"/></text><text x="40" y="272" class="dim" font-size="12.5" opacity="0">api that authenticates them, down to the postgres schema underneath.<animate attributeName="opacity" values="0;0;1" dur="0.5s" begin="1.28s" fill="freeze"/></text><text x="40" y="292" class="dim" font-size="12.5" opacity="0">software engineering graduate — the kind who reads the whole stack<animate attributeName="opacity" values="0;0;1" dur="0.5s" begin="1.46s" fill="freeze"/></text><text x="40" y="312" class="dim" font-size="12.5" opacity="0">trace before asking for help.<animate attributeName="opacity" values="0;0;1" dur="0.5s" begin="1.64s" fill="freeze"/></text><text x="40" y="354" class="dim" font-size="10.5" opacity="0.7">// still reading — capacity has not capped yet</text><circle cx="810" cy="174.8" r="76" fill="none" stroke="#1c1c24" stroke-width="6"/><circle cx="810" cy="174.8" r="76" fill="none" stroke="url(#goldbarw)" stroke-width="6" stroke-linecap="round"