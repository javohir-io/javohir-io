<svg width="1000" height="30" viewBox="0 0 1000 30" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="divider">
<title>divider</title>
<style>

@keyframes sldv{from{transform:translateX(-380px)}to{transform:translateX(380px)}}.sldv{animation:sldv 7s ease-in-out infinite alternate}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="sgdv" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B98A44" stop-opacity="0"/><stop offset="0.5" stop-color="#B98A44" stop-opacity="1"/><stop offset="1" stop-color="#B98A44" stop-opacity="0"/></linearGradient>
<linearGradient id="fladv" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8A6229" stop-opacity="0.8"/><stop offset="1" stop-color="#8A6229" stop-opacity="0"/></linearGradient>
<linearGradient id="flbdv" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8A6229" stop-opacity="0.8"/><stop offset="1" stop-color="#8A6229" stop-opacity="0"/></linearGradient>
</defs>
<rect x="80" y="14.5" width="396.0" height="1" fill="url(#fladv)"/>
<g transform="translate(1000 0) scale(-1 1)"><rect x="80" y="14.5" width="396.0" height="1" fill="url(#flbdv)"/></g>
<rect x="495.0" y="10" width="10" height="10" transform="rotate(45 500.0 15)" fill="none" stroke="#8A6229" stroke-width="1.4"/>
<rect x="497.8" y="12.8" width="4.4" height="4.4" fill="#8A6229" opacity="1"/>
<rect class="sldv" x="410.0" y="14" width="180" height="2" fill="url(#sgdv)"/>
</svg>
