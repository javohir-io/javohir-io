<svg width="1000" height="20" viewBox="0 0 1000 20" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dgdiv" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0969da" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0969da" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0969da" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes slidediv{0%{transform:translateX(-40%)}100%{transform:translateX(40%)}}
    .sweepdiv{animation:slidediv 3.4s ease-in-out infinite alternate}
  </style>
  <line x1="0" y1="10.0" x2="1000" y2="10.0" stroke="#d0d7de" stroke-width="1"/>
  <rect class="sweepdiv" x="300.0" y="9.0" width="400.0" height="2" fill="url(#dgdiv)"/>
</svg>