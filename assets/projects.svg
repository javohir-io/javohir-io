<text x="54" y="86" font-size="10.5" class="dim" letter-spacing="0.5">case 01 / full-stack</text>
<text x="54" y="110" font-size="16" class="ink" font-weight="700">JobFlow — Job Application Platform</text>
<text x="54" y="134" font-size="12" class="muted">Flutter app + Node/Express API + Postgres.</text>
<text x="54" y="152" font-size="12" class="muted">JWT auth, resume uploads, interview calendar,</text>
<text x="54" y="170" font-size="12" class="muted">and a plain-JS admin panel on the same API.</text>
