<text x="482.0" y="86" font-size="10.5" class="dim" letter-spacing="0.5">case 02 / game dev</text>
<text x="482.0" y="110" font-size="16" class="ink" font-weight="700">Flutter Arcade Game</text>
<text x="482.0" y="134" font-size="12" class="muted">A mobile game built solo with Flutter &amp; Dart.</text>
<text x="482.0" y="152" font-size="12" class="muted">Custom game loop and UI, no external game</text>
<text x="482.0" y="170" font-size="12" class="muted">engine — just the framework and the logic.</text>
<rect x="482.0" y="192" width="72.9" height="24" rx="4" fill="#f0f2f5" stroke="#d7dce2" stroke-width="1"/><text x="492.0" y="208.5" font-size="12.5" fill="#0d1117">Flutter</text>
