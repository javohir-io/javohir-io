@keyframes rdfta{from{stroke-dashoffset:0}to{stroke-dashoffset:-1000}}.rdfta{animation:rdfta 8s linear 0.0s infinite}
@keyframes rdftb{from{stroke-dashoffset:0}to{stroke-dashoffset:-1000}}.rdftb{animation:rdftb 8s linear 3s infinite}
@keyframes emft{0%{transform:translateY(0);opacity:0}15%{opacity:1}85%{opacity:.7}100%{transform:translateY(-100px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
